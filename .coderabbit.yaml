# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# 이 파일에 없는 설정은 CodeRabbit 웹에서 해둔 설정을 그대로 사용한다.
# (false면 이 파일에 없는 설정이 웹 설정이 아니라 기본값으로 돌아간다)
inheritance: true

language: ko-KR

reviews:
  # PR 본문의 @coderabbitai summary 자리에 변경 내용 요약을 채운다. (PR 템플릿의 '작업 내용' 섹션)
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_instructions: |
    한국어로, 이 PR에서 바뀐 내용을 bullet 3~5개로 짧게 정리한다.
    - 각 bullet은 "무엇을 했는지"를 한 줄로 쓴다. 파일 이름 나열은 하지 않는다.
    - 사용자 화면에 보이는 변화가 있으면 먼저 쓴다.
    - 제목, 표, 이모지는 쓰지 않는다.

  # PR 제목에 @coderabbitai 라고만 쓰고 열면 변경 내용을 보고 제목을 만들어준다.
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: |
    `{타입}: {설명}` 형식으로 한 줄만 작성한다.
    - 타입은 다음 중 하나: feat, fix, refactor, style, docs, test, chore, ci
      - feat: 새 기능, 기존 기능 개선 / fix: 버그 수정 / refactor: 동작 변화 없는 코드 개선
      - style: 화면 스타일·마크업 변경 / docs: 문서 / test: 테스트
      - chore: 설정, 의존성, 빌드 등 기타 / ci: GitHub Actions 등 CI 설정
    - 설명은 한국어로, 무엇을 했는지 짧게 쓴다. 마침표를 붙이지 않는다.
    - 콜론 앞에는 공백을 넣지 않고, 뒤에는 한 칸 띄운다.
    - 예: feat: 레시피 저장 추가, fix: 로그인 후 이전 페이지로 이동하지 않는 문제 수정
