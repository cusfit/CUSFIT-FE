name: 🔧 설정·기타 작업
description: 빌드·CI·의존성·문서 등 기능과 버그가 아닌 작업에 사용해주세요.
title: '[CHORE] '
type: Task
labels: ['Setting']
body:
  - type: dropdown
    id: kind
    attributes:
      label: 작업 유형
      options:
        - chore (설정, 의존성, 기타)
        - ci (GitHub Actions 등)
        - docs (문서)
        - refactor (동작 변화 없는 코드 개선)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇을 하나요?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 상세 내용
      value: |
        - [ ] TODO
